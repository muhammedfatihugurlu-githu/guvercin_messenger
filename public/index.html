<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp - Güvercin Edition</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      background: #00a884; 
      margin: 0; 
      padding: 0; 
      height: 100vh; 
      height: 100dvh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      overflow: hidden;
    }
    
    .app-container { 
      position: relative; 
      width: 100%; 
      height: 100%; 
      background: #efeae2; 
      display: flex; 
      overflow: hidden; 
    }

    /* Masaüstü Ekran İyileştirmeleri */
    @media (min-width: 769px) {
      body { background: #d1d7db; }
      .app-container { 
        max-width: 950px; 
        height: 90vh; 
        border-radius: 12px; 
        box-shadow: 0 8px 30px rgba(0,0,0,0.15); 
      }
      .back-btn { display: none !important; }
    }

    /* GİRİŞ EKRANI */
    .login-overlay { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: #f0f2f5; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      z-index: 100; 
      padding: 20px;
    }
    .login-card { 
      background: white; 
      width: 100%; 
      max-width: 360px; 
      padding: 30px 24px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
      text-align: center; 
    }
    
    .login-avatar { width: 70px; height: 70px; background: #e8f5e9; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 34px; margin: 0 auto 15px auto; }
    .login-title { font-size: 20px; color: #111b21; font-weight: 600; margin-bottom: 6px; }
    .login-desc { font-size: 13px; color: #667781; margin-bottom: 22px; line-height: 1.4; }
    
    .input-group { margin-bottom: 15px; text-align: left; }
    label { display: block; margin-bottom: 6px; font-size: 11px; color: #00a884; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .login-card input { 
      width: 100%; 
      padding: 12px 14px; 
      border: 1.5px solid #e0e0e0; 
      border-radius: 8px; 
      font-size: 16px; /* Mobil klavye zoom engeli */
      outline: none; 
    }
    .login-card input:focus { border-color: #00a884; }
    
    .login-card button { 
      width: 100%; 
      padding: 14px; 
      background: #00a884; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-weight: 600; 
      font-size: 16px; 
      cursor: pointer; 
      margin-top: 5px; 
    }
    .otp-input { text-align: center; font-size: 22px !important; letter-spacing: 10px; font-weight: bold; }

    /* SOL PANEL: SOHBET LİSTESİ */
    .sidebar { 
      width: 320px; 
      background: #ffffff; 
      border-right: 1px solid #e0e0e0; 
      display: flex; 
      flex-direction: column; 
    }
    .sidebar-header { 
      background: #008069; 
      color: white; 
      padding: 16px; 
      font-weight: bold; 
      font-size: 17px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    
    .add-contact-box { padding: 10px; background: #f0f2f5; border-bottom: 1px solid #e0e0e0; display: flex; gap: 8px; }
    .add-contact-box input { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; }
    .add-contact-box button { background: #00a884; color: white; border: none; border-radius: 8px; font-weight: bold; padding: 0 16px; font-size: 18px; }

    .contact-list { flex: 1; overflow-y: auto; }
    .contact-item { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .contact-item:active { background: #e9edef; }
    .contact-item.active { background: #f0f2f5; font-weight: bold; }
    .contact-phone { font-size: 15px; color: #111b21; }
    .contact-last-msg { font-size: 13px; color: #667781; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* SAĞ PANEL: SOHBET ALANI */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
    .chat-header { 
      background: #f0f2f5; 
      padding: 10px 14px; 
      border-bottom: 1px solid #e0e0e0; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      height: 60px;
    }
    .back-btn { font-size: 22px; cursor: pointer; padding: 4px 8px; color: #00a884; font-weight: bold; }
    .chat-header-title { font-weight: bold; color: #111b21; font-size: 16px; }
    .chat-header-sub { font-size: 12px; color: #667781; }

    .chat-body { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }

    .msg-bubble { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 15px; word-wrap: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
    .msg-outgoing { background: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; }
    .msg-incoming { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; }
    .msg-info { font-size: 11px; color: #666; margin-top: 4px; text-align: right; display: flex; justify-content: flex-end; gap: 4px; }

    .system-banner { background: #fff3cd; color: #856404; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; border: 1px solid #ffeeba; margin-bottom: 10px; }

    .chat-footer { background: #f0f2f5; padding: 8px 10px; display: flex; gap: 8px; align-items: center; }
    .chat-footer input { flex: 1; border-radius: 20px; border: none; padding: 12px 16px; font-size: 15px; outline: none; }
    .chat-footer button { width: 44px; height: 44px; border-radius: 50%; background: #00a884; color: white; border: none; font-size: 18px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
    .chat-footer button:disabled { background: #a5d6a7; }

    #otp-step { display: none; }
    .empty-state { display: flex; flex: 1; justify-content: center; align-items: center; color: #667781; font-size: 15px; text-align: center; padding: 20px; }

    /* MOBİL DUYARLILIK (RESPONSIVE) KONTROLLERİ */
    @media (max-width: 768px) {
      .sidebar { width: 100%; }
      .chat-area { width: 100%; display: none; }
      
      .app-container.show-chat .sidebar { display: none; }
      .app-container.show-chat .chat-area { display: flex; }
    }
  </style>
</head>
<body>

<div id="app-container" class="app-container">
  <!-- GİRİŞ EKRANI -->
  <div id="login-overlay" class="login-overlay">
    <div id="phone-step" class="login-card">
      <div class="login-avatar">🕊️</div>
      <div class="login-title">Güvercin Messenger</div>
      <div class="login-desc">Giriş yapmak için cep telefonu numaranızı girin</div>
      
      <div class="input-group">
        <label>Telefon Numarası</label>
        <input id="my-phone" type="tel" placeholder="05XXXXXXXXX" maxlength="11" />
      </div>
      <button onclick="requestSMS()">Devam Et</button>
    </div>

    <div id="otp-step" class="login-card">
      <div class="login-avatar">📲</div>
      <div class="login-title">Doğrulama Kodu</div>
      <div class="login-desc">Terminalde görünen 4 haneli SMS kodunu girin</div>
      
      <div class="input-group">
        <label>SMS Kodu</label>
        <input id="otp-code" class="otp-input" type="tel" placeholder="••••" maxlength="4" />
      </div>
      <button onclick="verifySMS()">Giriş Yap</button>
    </div>
  </div>

  <!-- SOL PANEL: SOHBET LİSTESİ -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span>🕊️ Güvercin</span>
      <span id="my-phone-display" style="font-size: 12px; opacity: 0.9;"></span>
    </div>

    <div class="add-contact-box">
      <input id="new-contact-phone" type="tel" placeholder="Kişi ekle (05XXXXXXXXX)" maxlength="11" />
      <button onclick="addNewContact()">+</button>
    </div>

    <div id="contact-list" class="contact-list"></div>
  </div>

  <!-- SAĞ PANEL: SOHBET ALANI -->
  <div class="chat-area">
    <div class="chat-header">
      <div class="back-btn" onclick="backToContacts()">←</div>
      <div>
        <div id="active-contact-title" class="chat-header-title">Sohbet Seçin</div>
        <div id="active-contact-sub" class="chat-header-sub">Sol taraftan bir numara seçin</div>
      </div>
    </div>

    <div id="chat-body" class="chat-body">
      <div id="system-banner" class="system-banner" style="display:none;"></div>
      <div id="empty-state" class="empty-state">Mesajlaşmak için bir sohbet seçin</div>
    </div>

    <div class="chat-footer">
      <input id="message-text" placeholder="Bir mesaj yazın..." onkeypress="handleKeyPress(event)" disabled />
      <button id="send-btn" onclick="sendPigeon()" disabled>🕊️</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let myPhone = '';
  let activeContact = null;
  let allMessages = [];
  let contacts = new Set();
  let myLat = 41.0082;
  let myLng = 28.9784;

  function isValidPhone(phone) {
    return /^05[0-9]{9}$/.test(phone);
  }

  function requestSMS() {
    const input = document.getElementById('my-phone').value.trim();
    if (!isValidPhone(input)) return alert('Geçerli numara girin! (Örn: 05551112233)');

    myPhone = input;
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        myLat = pos.coords.latitude;
        myLng = pos.coords.longitude;
      });
    }

    socket.emit('request otp', myPhone);
  }

  socket.on('otp sent', () => {
    document.getElementById('phone-step').style.display = 'none';
    document.getElementById('otp-step').style.display = 'block';
  });

  function verifySMS() {
    const code = document.getElementById('otp-code').value.trim();
    if (code.length !== 4) return alert('4 haneli kodu girin.');
    socket.emit('verify otp', { phoneNumber: myPhone, code });
  }

  socket.on('login success', (data) => {
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('my-phone-display').innerText = data.phoneNumber;

    allMessages = data.history || [];
    
    allMessages.forEach(m => {
      const other = m.senderPhone === myPhone ? m.receiverPhone : m.senderPhone;
      if (other) contacts.add(other);
    });

    renderContacts();

    if (data.pigeonState === 'busy') {
      setSendButtonState(false);
    }
  });

  socket.on('login failed', (data) => alert(data.message));
  socket.on('pigeon error', (data) => alert(data.message));

  function addNewContact() {
    const input = document.getElementById('new-contact-phone');
    const phone = input.value.trim();

    if (!isValidPhone(phone)) return alert('Geçerli numara girin!');
    if (phone === myPhone) return alert('Kendi numaranızı ekleyemezsiniz!');

    contacts.add(phone);
    input.value = '';
    renderContacts();
    selectContact(phone);
  }

  function renderContacts() {
    const list = document.getElementById('contact-list');
    list.innerHTML = '';

    contacts.forEach(phone => {
      const item = document.createElement('div');
      item.className = `contact-item ${phone === activeContact ? 'active' : ''}`;
      item.onclick = () => selectContact(phone);

      const lastMsg = allMessages
        .filter(m => (m.senderPhone === myPhone && m.receiverPhone === phone) || (m.senderPhone === phone && m.receiverPhone === myPhone))
        .pop();

      item.innerHTML = `
        <div class="contact-phone">${phone}</div>
        <div class="contact-last-msg">${lastMsg ? lastMsg.message : 'Henüz mesaj yok'}</div>
      `;

      list.appendChild(item);
    });
  }

  function selectContact(phone) {
    activeContact = phone;
    document.getElementById('active-contact-title').innerText = phone;
    document.getElementById('active-contact-sub').innerText = 'Güvercin Postası Aktif';
    document.getElementById('message-text').disabled = false;
    document.getElementById('send-btn').disabled = false;

    // Mobil ekranda sohbet görünümüne geç
    document.getElementById('app-container').classList.add('show-chat');

    renderContacts();
    renderActiveChat();
  }

  function backToContacts() {
    document.getElementById('app-container').classList.remove('show-chat');
  }

  function renderActiveChat() {
    const chatBody = document.getElementById('chat-body');
    chatBody.innerHTML = '<div id="system-banner" class="system-banner" style="display:none;"></div>';

    if (!activeContact) {
      chatBody.innerHTML += '<div id="empty-state" class="empty-state">Mesajlaşmak için bir sohbet seçin</div>';
      return;
    }

    const filtered = allMessages.filter(m => 
      (m.senderPhone === myPhone && m.receiverPhone === activeContact) ||
      (m.senderPhone === activeContact && m.receiverPhone === myPhone)
    );

    filtered.forEach(appendMessageToBody);
  }

  function appendMessageToBody(msg) {
    const chatBody = document.getElementById('chat-body');
    const emptyState = document.getElementById('empty-state');
    if (emptyState) emptyState.remove();

    const isOutgoing = msg.senderPhone === myPhone;

    const bubble = document.createElement('div');
    bubble.className = `msg-bubble ${isOutgoing ? 'msg-outgoing' : 'msg-incoming'}`;

    bubble.innerHTML = `
      <div>${msg.message}</div>
      <div class="msg-info">
        <span>📍 ${msg.distance} km</span> • 
        <span>${msg.time}</span>
        ${isOutgoing ? '<span>🕊️</span>' : ''}
      </div>
    `;

    chatBody.appendChild(bubble);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function sendPigeon() {
    if (!activeContact) return alert('Lütfen sohbet edilecek kişiyi seçin!');
    const messageInput = document.getElementById('message-text');
    const message = messageInput.value.trim();

    if (!message) return;

    socket.emit('send pigeon', {
      senderPhone: myPhone,
      receiverPhone: activeContact,
      senderLat: myLat,
      senderLng: myLng,
      receiverLat: myLat + 0.015,
      receiverLng: myLng + 0.015,
      message
    });

    messageInput.value = '';
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') sendPigeon();
  }

  function setSendButtonState(enabled) {
    const btn = document.getElementById('send-btn');
    btn.disabled = !enabled;
  }

  socket.on('pigeon status', (data) => {
    allMessages.push(data.messageData);
    if (activeContact === data.receiverPhone) {
      appendMessageToBody(data.messageData);
    }
    renderContacts();
    setSendButtonState(false);

    const banner = document.getElementById('system-banner');
    banner.style.display = 'block';
    let timeLeft = data.flightTimeInSeconds;

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(timer);
      } else {
        banner.innerText = `🕊️ Güvercin yolda... Kalan: ${timeLeft} sn (${data.distance} km)`;
      }
    }, 1000);
  });

  socket.on('pigeon delivered', (data) => {
    const banner = document.getElementById('system-banner');
    banner.innerText = data.message;
    setSendButtonState(true);

    setTimeout(() => { banner.style.display = 'none'; }, 3000);
  });

  socket.on('pigeon arrived', (msgData) => {
    allMessages.push(msgData);
    contacts.add(msgData.senderPhone);

    if (activeContact === msgData.senderPhone) {
      appendMessageToBody(msgData);
    }
    renderContacts();
  });
</script>

</body>
</html>
